# 创建application-local.properties来覆盖本配置

spring.application.name=bill
server.servlet.context-path=/api

spring.datasource.username = root
spring.datasource.password = YOUR_PASSWORD_HERE
spring.datasource.url = jdbc:mysql://127.0.0.1:3306/bill?characterEncoding=utf-8
spring.datasource.driver-class-name: com.mysql.cj.jdbc.Driver

spring.jackson.date-format: yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone: GMT+8

# Secrets - real values in application-local.properties (gitignored)
app.password.salt = YOUR_SALT_HERE
app.jwt.secret = YOUR_JWT_SECRET_HERE
# Import local secrets (ignored by git)
spring.config.import = optional:classpath:application-local.properties

mybatis.mapper-locations: classpath:/mapper/*.xml
mybatis.configuration.mybatis.log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
mybatis.configuration.map-underscore-to-camel-case=true
